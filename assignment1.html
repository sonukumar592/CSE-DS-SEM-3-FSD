<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>
<body>
    <script>
        let name = prompt("Enter Student Name:");
        let rollNo = prompt("Enter Roll Number:");

        let m1 = Number(prompt("Enter marks of Subject 1:"));
        let m2 = Number(prompt("Enter marks of Subject 2:"));
        let m3 = Number(prompt("Enter marks of Subject 3:"));
        let m4 = Number(prompt("Enter marks of Subject 4:"));
        let m5 = Number(prompt("Enter marks of Subject 5:"));

        let totalMarks = Total(m1, m2, m3, m4, m5);
        let percentage = Percentage(totalMarks);
        let grade = Grade(percentage);

        function Total(m1, m2, m3, m4, m5) {
            return m1 + m2 + m3 + m4 + m5;
        }

        function Percentage(total) {
            return (total / 500) * 100;
        }

        function Grade(percentage) {
            if (percentage >= 90) {
                return "A+";
            } else if (percentage >= 80) {
                return "A";
            } else if (percentage >= 70) {
                return "B";
            } else if (percentage >= 60) {
                return "C";
            } else if (percentage >= 50) {
                return "D";
            } else {
                return "Fail";
            }
        }

        function displayResult(name, rollNo, total, percentage, grade) {
            document.write("Name: " + name + "<br>");
            document.write("Roll No: " + rollNo + "<br>");
            document.write("Total Marks: " + total + " / 500<br>");
            document.write("Percentage: " + percentage.toFixed(2) + "%<br>");
            document.write("Grade: " + grade);
        }

        displayResult(name, rollNo, totalMarks, percentage, grade);
    </script>
</body>
</html>
